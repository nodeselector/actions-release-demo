name: Release source
description: Reports the source used to load this action

outputs:
  ref:
    description: Ref used to load this action
    value: ${{ steps.source.outputs.ref }}

runs:
  using: composite
  steps:
    - id: source
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        echo "ref=$ACTION_REF" >> "$GITHUB_OUTPUT"
