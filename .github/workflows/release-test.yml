name: Validate release candidate
run-name: Validate ${{ github.ref_name }} for release run ${{ inputs.release_run_id }}

on:
  workflow_dispatch:
    inputs:
      asset:
        description: Candidate release asset name
        required: true
        type: string
      release_run_id:
        description: Release workflow run ID
        required: true
        type: string

permissions:
  attestations: read
  contents: read

jobs:
  exact-tag:
    name: Validate action and release asset
    runs-on: ubuntu-latest
    steps:
      - id: candidate
        uses: $/

      - name: Confirm the action commit
        env:
          ACTION_REF: ${{ steps.candidate.outputs.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$ACTION_REF" = "$GITHUB_SHA"

      - name: Verify the immutable candidate and its provenance
        env:
          ACTION_REF: ${{ steps.candidate.outputs.ref }}
          ASSET: ${{ inputs.asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=false
          for _ in {1..30}; do
            if gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
              verified=true
              break
            fi
            sleep 2
          done
          if [[ "$verified" != true ]]; then
            echo "::error::Release attestation for $GITHUB_REF_NAME wasn't available after 60 seconds. Retry this validation run."
            exit 1
          fi

          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET"
          gh release verify-asset "$GITHUB_REF_NAME" "$ASSET" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$ASSET" --repo "$GITHUB_REPOSITORY"

          {
            echo "### Release candidate verification"
            echo
            echo "| Source | Value |"
            echo "| --- | --- |"
            echo "| Workflow ref | \`$GITHUB_REF\` |"
            echo "| Workflow SHA | \`$GITHUB_SHA\` |"
            echo "| \`$/\` action SHA | \`$ACTION_REF\` |"
            echo "| Immutable asset | \`$ASSET\` |"
          } >> "$GITHUB_STEP_SUMMARY"
