name: Validate release candidate

on:
  workflow_call:
    inputs:
      asset:
        description: Candidate release asset name
        required: true
        type: string
      candidate:
        description: Candidate release tag
        required: true
        type: string
      commit:
        description: Candidate commit SHA
        required: true
        type: string

permissions:
  attestations: read
  contents: read

jobs:
  candidate:
    name: Validate action and release asset
    runs-on: ubuntu-latest
    steps:
      - id: candidate
        uses: $/

      - name: Confirm the action commit
        env:
          ACTION_REF: ${{ steps.candidate.outputs.ref }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$ACTION_REF" = "$EXPECTED_COMMIT"

      - name: Verify the immutable candidate and its provenance
        env:
          ACTION_REF: ${{ steps.candidate.outputs.ref }}
          ASSET: ${{ inputs.asset }}
          CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=false
          for _ in {1..30}; do
            if gh release verify "$CANDIDATE" --repo "$GITHUB_REPOSITORY"; then
              verified=true
              break
            fi
            sleep 2
          done
          if [[ "$verified" != true ]]; then
            echo "::error::Release attestation for $CANDIDATE wasn't available after 60 seconds. Run Release again with the same bump."
            exit 1
          fi

          gh release download "$CANDIDATE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET"
          gh release verify-asset "$CANDIDATE" "$ASSET" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$ASSET" --repo "$GITHUB_REPOSITORY"

          {
            echo "### Release candidate verification"
            echo
            echo "| Source | Value |"
            echo "| --- | --- |"
            echo "| Candidate | [$CANDIDATE](https://github.com/$GITHUB_REPOSITORY/releases/tag/$CANDIDATE) |"
            echo "| Release workflow SHA | \`$GITHUB_SHA\` |"
            echo "| \`$/\` action SHA | \`$ACTION_REF\` |"
            echo "| Immutable asset | \`$ASSET\` |"
          } >> "$GITHUB_STEP_SUMMARY"
